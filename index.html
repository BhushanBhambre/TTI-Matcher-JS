<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTI Code Matcher</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    html, body { background: #0b0f19; color: #f8fafc; }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
    }
    .card-inner {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
    }

    /* Progress bar */
    .progress-track {
      background: #1e293b;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #4f46e5;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Scrollbar */
    .scroll::-webkit-scrollbar { width: 5px; }
    .scroll::-webkit-scrollbar-track { background: #0f172a; }
    .scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Modal backdrop */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
    }
    .modal-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    /* Mode card */
    .mode-card {
      border: 1.5px solid #1f2937;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: #0f172a;
    }
    .mode-card:hover { border-color: #4f46e5; }
    .mode-card.selected { border-color: #4f46e5; background: #1e1b4b; }

    /* File drop zone */
    .dropzone {
      border: 1.5px dashed #1f2937;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .dropzone:hover { border-color: #4f46e5; }
    .dropzone.filled { border-style: solid; border-color: #1e3a8a; background: #172554; }

    /* Btn */
    .btn-primary {
      background: #4f46e5;
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
    .btn-green {
      background: #059669;
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-green:hover { background: #047857; }

    /* Pulse dot */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }

    /* Spin */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin></script>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>
  <script src="./streamReader.js"></script>
  <script src="./matcher.js"></script>
  <script type="text/babel" src="./app.js"></script>
</body>
</html>
