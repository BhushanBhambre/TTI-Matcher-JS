<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TTI Code Matcher</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* Professional Clean Dark Theme */
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
    }
    .glass-card {
      background: #131b2e;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .glass-card-sm {
      background: #0f172a;
      border: 1px solid #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>

  <!-- React + ReactDOM (production builds) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <!-- SheetJS for .xlsx export -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin></script>
</head>
<body class="font-sans antialiased selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <!-- Internal Scripts: Stream Reader -> Matcher -> React App -->
  <script src="./streamReader.js"></script>
  <script src="./matcher.js"></script>
  <script type="text/babel" src="./app.js"></script>
</body>
</html>
